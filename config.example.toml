# Referat configuration.
#
# This file is the template. On first run Referat copies it to `config.toml`
# in the repository root, which is gitignored and is the file you actually edit.
# Set REFERAT_CONFIG to point somewhere else if you need to.

[hotkeys]
# Combos in the `keyboard` library's syntax, e.g. "ctrl+alt+f9", "ctrl+shift+r".
# These are what the programmable USB buttons should emit.
toggle_record = "ctrl+alt+f9"
toggle_pause = "ctrl+alt+f10"

[audio]
# Case-insensitive substring match against the device name; "" = system default.
mic_device = ""
# WASAPI loopback source; "" = loopback of the current default output device.
loopback_device = ""
# Microphone is captured mono at this rate (what Whisper wants).
mic_samplerate = 16000
# The loopback stream is captured at the output device's native mix rate,
# downmixed to mono, and resampled at transcription time.
# Windows delivers no loopback frames while nothing is playing, so quiet
# stretches are written as real silence. That keeps a position in system.wav
# and the same position in mic.wav meaning the same moment of the meeting,
# at the cost of roughly 345 MB per hour.

[paths]
# One subfolder per meeting is created here.
meetings_dir = "~/Meetings"
# Plain text file containing a Hugging Face token, needed only for diarization.
hf_token_file = "~/.referat/hf_token"

[transcription]
# faster-whisper model used when CUDA is available.
model = "large-v3"
# Smaller model used when falling back to CPU.
cpu_fallback_model = "medium"
# auto | cuda | cpu
device = "auto"
# float16 on GPU, int8 on CPU. "auto" picks per device.
compute_type = "auto"
# Language hint; "" means autodetect.
language = "en"
# Diarize the loopback channel into SPEAKER_01, SPEAKER_02, ...
# Falls back to undifferentiated "REMOTE:" labels whenever diarization cannot
# run: no HF token, an unaccepted gated repository, or any error in the pipeline.
# The transcript is never at risk; only the speaker names are.
diarization = true
# The pyannote checkpoint. community-1 is the one that matches pyannote.audio 4;
# it is gated, so the token above must belong to an account that has accepted its
# conditions at https://hf.co/pyannote/speaker-diarization-community-1
diarization_model = "pyannote/speaker-diarization-community-1"

[app]
# DEBUG | INFO | WARNING | ERROR
log_level = "INFO"
