# Referat configuration.
#
# This file is the template. On first run Referat copies it to `config.toml`
# in the repository root, which is gitignored and is the file you actually edit.
# Set REFERAT_CONFIG to point somewhere else if you need to.

[hotkeys]
# Combos in the `keyboard` library's syntax, e.g. "ctrl+alt+f9", "ctrl+shift+r".
# These are what the programmable USB buttons should emit.
toggle_record = "ctrl+alt+f9"
toggle_pause = "ctrl+alt+f10"

[audio]
# Case-insensitive substring match against the device name; "" = system default.
# Run `referat devices` for the names, and to check which one these two keys
# actually resolve to: a substring that matches nothing is not an error, it just
# falls back to the default, so a typo here quietly records the wrong microphone.
# Worth naming the device even when it is already the default. PortAudio exposes
# the same microphone once per host API, and naming it picks the WASAPI copy,
# which is often at the device's native rate while the default is the MME copy
# at 44100 Hz.
mic_device = ""
# WASAPI loopback source; "" = loopback of the current default output device,
# which is usually what you want: it follows whatever is actually playing.
loopback_device = ""
# Microphone is captured mono at this rate (what Whisper wants).
mic_samplerate = 16000
# The loopback stream is captured at the output device's native mix rate,
# downmixed to mono, and resampled at transcription time.
# Windows delivers no loopback frames while nothing is playing, so quiet
# stretches are written as real silence. That keeps a position in system.wav
# and the same position in mic.wav meaning the same moment of the meeting,
# at the cost of roughly 345 MB per hour.

[paths]
# One subfolder per meeting is created here.
meetings_dir = "~/Meetings"
# Where a meeting is recorded and transcribed, before it moves into
# `meetings_dir`. Leave it unset for `%LOCALAPPDATA%\Referat\recording`.
# Recording never writes into the meetings folder, because that folder may be
# synced: the WAVs are ~460 MB an hour and are deleted once the transcript is
# judged good, but a sync client would upload every one of them on the way past
# and then keep the "deleted" audio in its trash and version history for weeks.
# A meeting whose audio was kept stays here; `referat list` still shows it.
# staging_dir = "~/.referat/recording"
# Plain text file containing a Hugging Face token, needed only for diarization.
hf_token_file = "~/.referat/hf_token"
# Where the known-voices database lives. Leave it unset and it sits in
# `<meetings_dir>/.voices/`, which is right as long as the meetings folder is not
# synced anywhere. Set it when the meetings folder is inside Dropbox, OneDrive or
# iCloud: the transcripts and notes are worth syncing, but `voices.json` holds
# voiceprints of everyone who has been recorded — biometric data about people who
# never asked to be in a database. Keeping it out by configuration beats a
# per-folder sync exclusion nobody remembers to re-apply.
# Use single quotes for Windows paths: in a double-quoted TOML string a backslash
# starts an escape, so "C:\Users\..." fails to parse before Referat ever sees it.
# voices_dir = "~/.referat/voices"

[transcription]
# faster-whisper model used when CUDA is available.
model = "large-v3"
# Smaller model used when falling back to CPU.
cpu_fallback_model = "medium"
# auto | cuda | cpu
device = "auto"
# float16 on GPU, int8 on CPU. "auto" picks per device.
compute_type = "auto"
# The languages this machine is expected to hear, most likely first. One code
# pins it and asks Whisper nothing; two or more run a detection pass per channel
# and take the best of these; [] is bare autodetect over everything Whisper knows.
# The middle form is not the same as the empty one: Swedish sits among Norwegian,
# Danish, German and Dutch, and an unrestricted guess off a quiet or short channel
# lands in that neighbourhood often enough to matter — which costs the whole
# channel, since a language is chosen once and every segment decoded under it.
# Detection is per channel (the mic is the room, the loopback is the far end) and
# never per segment. Order is not preference; probability decides.
languages = ["en", "sv"]
# Diarize the loopback channel into SPEAKER_01, SPEAKER_02, ...
# Falls back to undifferentiated "REMOTE:" labels whenever diarization cannot
# run: no HF token, an unaccepted gated repository, or any error in the pipeline.
# The transcript is never at risk; only the speaker names are.
diarization = true
# The pyannote checkpoint. community-1 is the one that matches pyannote.audio 4;
# it is gated, so the token above must belong to an account that has accepted its
# conditions at https://hf.co/pyannote/speaker-diarization-community-1
diarization_model = "pyannote/speaker-diarization-community-1"
# Keep mic.wav and system.wav even when the quality gate accepts the transcript.
# Off by default, and that default is the right one: the WAVs are recordings of
# people who never asked to be recorded, and deleting them is a promise the
# pipeline keeps. Turn this on for a meeting whose audio is worth more than that
# once - the first multi-speaker recording, say, which is the only material there
# is for calibrating [speakers].match_threshold and match_margin - and turn it off
# again afterwards. Once the audio is gone no `rerun` brings it back.
# A meeting kept this way is not `gate_failed`: the gate still runs and still says
# so when a transcript looks bad. It stays `transcribed` and stays in staging,
# because no WAV may ever reach the meetings folder; release it with
# `referat promote <meeting-id> --release-audio`.
# keep_audio = false

# Words Whisper should be told about before it transcribes: names, acronyms,
# product names, jargon. This is the one correction that happens *before* the
# transcript exists - everything else is corrected in the notes, because
# `transcript.md` is immutable and keeps whatever was heard.
#
# One list for the machine, never one per project: a meeting is tagged after it
# has been transcribed, so at the moment the model runs there is nothing to
# select a list with. Referat merges three sources into it and this is only the
# third - every name in the known-voices database and every project's `glossary`
# in `projects.json` are already in there and maintain themselves. Put here what
# neither of those will ever hold. `referat hotwords` prints the merged list with
# the source of each term, and says what the 223-token budget made it drop.
hotword_extras = []

[speakers]
# Put names on the SPEAKER_NN that diarization produced, by matching each
# speaker against a database of voices learned from meetings already labeled.
# There is no enrollment step: `referat label <meeting-id>` plays a speaker's
# snippets, asks who it was, and remembers the answer for next time.
identify = true

# Your own name, for recognising you and writing your lines under it. Leave it
# empty until you want it: from the moment it is set, any meeting whose
# microphone held exactly one voice also files an embedding of you.
# You are labelled like anybody else - `Niklas:`, not `ME:`. ME means only that
# the microphone recorded a line and nothing attributed it, which on a mic that
# hears the whole room is frequently somebody else.
# One voice on the mic is the condition, and it is measured rather than assumed —
# a room with two people in it clusters into two speakers and files nothing, so
# an in-person meeting cannot quietly blend everybody into your voiceprint.
owner_name = ""

# How close a voice must be to a known one before it is called by that name
# (cosine similarity), and by how much it must beat the runner-up *name*. Both
# have to hold; short of either, the speaker stays SPEAKER_NN.
#
# When the database holds only one name there is no runner-up, so the margin is
# asked of the score itself and the bar becomes threshold + margin. That is the
# state the database is in right after owner_name is first set, and also when a
# false accept is worst: it renders somebody else's words under your own name.
#
# These two numbers are the only place a wrong name can be written into a
# transcript, which is worse than no name at all, so they start strict. Loosen
# them against real meetings — `meta.json` records the near-misses under each
# speaker's `match` key, which is the material to calibrate on.
match_threshold = 0.70
match_margin = 0.15

# Audio kept per unidentified speaker, for `referat label` to play back. Three
# six-second clips of 16 kHz mono is under 600 KB, and they are deleted as soon
# as that speaker has a name. They are cut during transcription because the WAVs
# they come from are deleted as soon as the meeting transcribes cleanly.
snippets_per_speaker = 3
snippet_seconds = 6.0

# The database itself lives in <meetings_dir>/.voices/. It is biometric personal
# data about people who never asked to be in it: keep that folder out of every
# sync client and backup tool, and use `referat label --forget <name>` to delete
# somebody outright.

[bleed]
# Removing the microphone's copy of speech that also arrived on the loopback.
#
# When the remote audio of a hybrid meeting comes out of a speaker standing in
# the same room as the microphone - a TV, a laptop, anything but a headset or the
# Jabra's own hardware echo cancellation - the far end is recorded twice, once
# digitally and once off the air. Both copies are transcribed, both are diarized,
# and both end up in transcript.md, usually under the same name once the speakers
# have been labeled. Measured on 2026-09-02_1059: of 1239 lines under a remote
# speaker's name, roughly 761 were the microphone's second copy.
#
# Suppression is one-directional. Microphone segments may be dropped; loopback
# segments never are. Not because the loopback transcribes better - it does - but
# because a conferencing app does not loop your own capture back into what it
# plays, so speech from the room can only ever exist on the microphone. Dropping
# a microphone segment risks a second copy; dropping a loopback segment risks the
# only copy of the far end.
suppress = true

# Seconds of tolerance when deciding two segments describe the same moment. An
# interval overlap rather than a gap between start times: two copies of one
# utterance were measured a median of 2 seconds apart but as much as 34, and the
# long ones are where one channel emitted a single run-on segment covering what
# the other split into several.
window = 6.0

# How much of the microphone line's words the loopback line must contain, and how
# much of the loopback line's words the microphone line must contain. The reverse
# direction is not symmetry for its own sake: without it a short line is swallowed
# by any longer line nearby that happens to hold its words, which produced 21
# pairings of one room speaker against another where requiring the reverse gave 8.
contain = 0.60
back_contain = 0.50

# Nothing shorter than this is ever dropped for matching some other line. More
# than half of a hybrid meeting is one- and two-token backchannels, and nothing
# distinguishes a remote person's second "Yeah" from the microphone's copy of
# their first. Those go only when the cluster rule below takes the whole cluster,
# which decides by whose voice they are rather than by what they say.
min_tokens = 5

# A whole microphone cluster is echo when this much of its speech time sits under
# loopback speech AND this much of its long-enough lines matches loopback text.
# Both, and that is the design: a microphone in a room is voiced almost
# continuously - 97% of the meeting these were fitted to - so time alone convicts
# anybody who talks while the far end is talking, while text alone misses a
# cluster that is mostly "Yeah." Someone talking *over* the far end scores high on
# time and near zero on text, and that is the case this pairing exists to spare.
#
# Unlike the three above, these two have no measurement behind them: the only
# hybrid meeting on this machine had its audio released, so the cluster rule has
# never been run against real material. Record the next one with
# [transcription].keep_audio = true and calibrate them against it.
cluster_time = 0.80
cluster_text = 0.50

[cleanup]
# Where the `claude` binary is, for `referat notes <id>` and the command center's
# Generate notes button. Leave empty and Referat finds it: it is not on PATH on
# this machine, so it looks inside the installed Claude Code VS Code extension -
# honouring the .obsolete file VS Code writes beside it, since the old version
# sits on disk next to the new one for a while - and then falls back to PATH.
# Resolved at every spawn and never remembered, because that path carries a
# version number that changes every few days.
#
# This is NOT a credential and there is nowhere in Referat that one belongs. The
# claude binary owns all authentication, under your own Claude Code login. No
# Anthropic API key goes in this file, in the environment, or in any module here.
claude_binary = ""

[app]
# DEBUG | INFO | WARNING | ERROR
log_level = "INFO"
