[project]
name = "referat"
version = "0.1.0"
description = "Personal offline meeting recorder, transcriber and diarizer for Windows 11."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Niklas Elmqvist", email = "niklas.elmqvist@gmail.com" }]

# Base dependencies: tray, hotkeys, dual-stream audio capture, and since build
# step 20 the command center. Kept free of CUDA wheels so a plain install stays
# small and fast.
#
# PySide6-Essentials is a deliberate exception to the minimal-dependencies
# convention, recorded as one in CLAUDE.md rather than left to look like drift.
# It is the command center, and because Qt owns the tray icon it is also on the
# recording path -- which is why step 20 gated it on a signature audit before
# anything was built on it. Essentials and not the full PySide6: QtWebEngine
# lives in PySide6-Addons, is 168 MB of wheel, spawns a Chromium helper process,
# and buys nothing QTextBrowser does not already do here.
dependencies = [
    "PySide6-Essentials>=6.8",
    "keyboard>=0.13.5",
    "sounddevice>=0.5",
    "numpy>=2.0",
    "PyAudioWPatch>=0.2.12.7",
]

[project.optional-dependencies]
# Transcription and diarization stack (build steps 5-7). ~3 GB of wheels.
#   uv sync --extra transcribe
transcribe = [
    "faster-whisper>=1.1",
    "torch>=2.7",
    "torchaudio>=2.7",
    # 4.x, not 3.x: `Pipeline.from_pretrained` takes `token=` where 3.x took
    # `use_auth_token=`, and the checkpoint is speaker-diarization-community-1.
    "pyannote.audio>=4.0",
]

[project.scripts]
referat = "referat.cli:main"

# Launched by pythonw.exe, so autostart brings up the tray with no console
# window. Use `python -m referat.tray` when you want the console output.
[project.gui-scripts]
referat-tray = "referat.tray:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["referat"]

# The RTX 5070 Ti Laptop GPU is Blackwell (sm_120) and needs torch built against
# CUDA 12.8. The default PyPI torch wheels do not support it.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
